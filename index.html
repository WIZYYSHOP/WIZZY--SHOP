<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIZYY SHOP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#070707;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:82px;
    background:rgba(5,5,5,.96);
    border-bottom:1px solid #241010;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(12px);
}

.logo{
    text-align:center;
}

.logo h1{
    font-size:30px;
    letter-spacing:5px;
    font-weight:900;
    color:#fff;
}

.logo h1 span{
    color:#e10600;
}

.logo p{
    margin-top:4px;
    font-size:11px;
    color:#aaa;
    letter-spacing:1px;
}

/* ================= CART ================= */

.cart{
    position:absolute;
    right:25px;
    top:22px;
    cursor:pointer;
    border:1px solid #321010;
    background:#0e0e0e;
    padding:10px 15px;
    border-radius:8px;
    transition:.2s;
}

.cart:hover{
    border-color:#e10600;
    box-shadow:0 0 15px rgba(225,6,0,.2);
}

.cart span{
    color:#e10600;
    font-weight:bold;
}

/* ================= HERO ================= */

.hero{
    text-align:center;
    padding:65px 20px 45px;
    background:
        radial-gradient(circle at center,rgba(225,6,0,.13),transparent 45%);
}

.hero h2{
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
}

.hero h2 span{
    color:#e10600;
}

.hero p{
    margin-top:12px;
    color:#888;
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    padding:20px;
}

.category{
    min-width:120px;
    padding:13px 20px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:8px;
    color:#aaa;
    cursor:pointer;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
    transition:.2s;
}

.category:hover{
    color:#fff;
    border-color:#8b0000;
    transform:translateY(-2px);
}

.category.active{
    color:#fff;
    background:#160707;
    border-color:#e10600;
    box-shadow:
        0 0 12px rgba(225,6,0,.25),
        inset 0 0 15px rgba(225,6,0,.08);
}

/* ================= WEAPONS ================= */

.weapon-box{
    display:none;
    max-width:1200px;
    margin:20px auto 35px;
    padding:22px;
    border:1px solid #241010;
    background:#0a0a0a;
    border-radius:12px;
}

.weapon-box.show{
    display:block;
}

.weapon-title{
    font-size:13px;
    color:#777;
    letter-spacing:2px;
    margin-bottom:16px;
    text-align:center;
}

.weapons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.weapon{
    padding:10px 14px;
    background:#101010;
    border:1px solid #272727;
    border-radius:7px;
    color:#999;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.weapon:hover{
    color:#fff;
    border-color:#a00000;
}

.weapon.active{
    color:#fff;
    background:#260707;
    border-color:#e10600;
    box-shadow:0 0 12px rgba(225,6,0,.22);
}

/* ================= FILTERS ================= */

.filters{
    max-width:1200px;
    margin:0 auto 25px;
    padding:0 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    padding:13px 15px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:8px;
    color:#fff;
    outline:none;
}

.search:focus{
    border-color:#e10600;
}

select{
    padding:13px 15px;
    background:#0d0d0d;
    border:1px solid #292929;
    color:#aaa;
    border-radius:8px;
    outline:none;
    cursor:pointer;
}

select:focus{
    border-color:#e10600;
}

/* ================= PRODUCTS ================= */

.products{
    max-width:1200px;
    margin:auto;
    padding:0 20px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.product{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:12px;
    overflow:hidden;
    transition:.25s;
}

.product:hover{
    transform:translateY(-5px);
    border-color:#8b0000;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

.product-img{
    width:100%;
    height:155px;
    background:#090909;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-img img{
    width:90%;
    height:90%;
    object-fit:contain;
    transition:.3s;
}

.product:hover .product-img img{
    transform:scale(1.06);
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
}

.product-weapon{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.product-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
}

.price{
    color:#e10600;
    font-size:15px;
    font-weight:bold;
}

.buy{
    background:#e10600;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:11px;
    transition:.2s;
}

.buy:hover{
    background:#ff160f;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:500px;
    background:#0b0b0b;
    border:1px solid #3b1010;
    border-radius:14px;
    padding:25px;
    position:relative;
    box-shadow:0 0 50px rgba(0,0,0,.7);
}

.close{
    position:absolute;
    right:18px;
    top:14px;
    color:#777;
    font-size:24px;
    cursor:pointer;
}

.close:hover{
    color:#fff;
}

.modal-image{
    width:100%;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080808;
    border-radius:10px;
    margin-bottom:20px;
}

.modal-image img{
    max-width:90%;
    max-height:90%;
    object-fit:contain;
}

.modal-content h2{
    font-size:22px;
}

.modal-content .modal-weapon{
    color:#777;
    margin-top:5px;
    font-size:12px;
}

.modal-options{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.modal-options label{
    color:#888;
    font-size:11px;
}

.modal-options select{
    width:100%;
}

.add-cart{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#e10600;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.add-cart:hover{
    background:#ff160f;
}

/* ================= CART PANEL ================= */

.cart-panel{
    position:fixed;
    right:-420px;
    top:0;
    width:400px;
    max-width:95%;
    height:100vh;
    background:#0a0a0a;
    border-left:1px solid #351010;
    z-index:3000;
    padding:25px;
    transition:.3s;
    overflow-y:auto;
}

.cart-panel.show{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    border-bottom:1px solid #222;
}

.cart-header h2{
    font-size:20px;
}

.cart-close{
    cursor:pointer;
    color:#888;
    font-size:22px;
}

.cart-item{
    padding:15px 0;
    border-bottom:1px solid #202020;
}

.cart-item strong{
    font-size:14px;
}

.cart-item small{
    display:block;
    color:#777;
    margin-top:5px;
}

.cart-item button{
    margin-top:8px;
    border:none;
    background:none;
    color:#e10600;
    cursor:pointer;
    font-size:11px;
}

.cart-total{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.telegram{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#e10600;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

/* ================= EMPTY ================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#555;
    padding:60px 0;
}

/* ================= FOOTER ================= */

footer{
    border-top:1px solid #1d1d1d;
    text-align:center;

    color:#555;
    font-size:12px;

footer strong{

footer p{

    }

    .product-info{

    }

    .product-name{
        font-size:13px;
    }

    .price{
        font-size:12px;
    }

    .buy{
        padding:7px 8px;
    }
}
</style>

/* =========================================================
   STATE
========================================================= */

/*
    مهم:
    selectedWeapons یک آرایه است.
    بنابراین می‌توانیم همزمان چند گان را انتخاب کنیم.
*/

let currentCategory = null;

let selectedWeapons = [];

let cart = [];

let currentProduct = null;


/* =========================================================
   CATEGORY SELECT
========================================================= */

function selectCategory(category,element){

    /*
        اگر همان Category دوباره کلیک شود:
        Category بسته می‌شود
        تمام Weapon ها Unselect می‌شوند
        همه اسکین‌ها دوباره نمایش داده می‌شوند
    */

    if(currentCategory === category){

        currentCategory = null;

        selectedWeapons = [];

        document
            .querySelectorAll(".category")
            .forEach(item=>{
                item.classList.remove("active");
            });

        document
            .getElementById("weaponBox")
            .classList.remove("show");

        renderProducts();

        return;
    }


    /*
        Category جدید
    */

    currentCategory = category;

    /*
        با عوض کردن Category انتخاب‌های قبلی پاک می‌شوند
    */

    selectedWeapons = [];


    document
        .querySelectorAll(".category")
        .forEach(item=>{
            item.classList.remove("active");
        });


    element.classList.add("active");


    document
        .getElementById("weaponBox")
        .classList.add("show");


    document
        .getElementById("weaponTitle")
        .textContent =
        category.toUpperCase() + " WEAPONS";


    renderWeapons();

    renderProducts();


    document
        .getElementById("weaponBox")
        .scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

}


/* =========================================================
   MULTI WEAPON SELECT
========================================================= */

function selectWeapon(weapon,element){

    /*
        اگر گان از قبل انتخاب شده:
        فقط همان گان را Unselect می‌کنیم
    */

    if(selectedWeapons.includes(weapon)){

        selectedWeapons =
            selectedWeapons.filter(
                item => item !== weapon
            );

        element.classList.remove("active");

    }

    /*
        اگر انتخاب نشده:
        به لیست انتخاب‌ها اضافه می‌شود
    */

    else{

        selectedWeapons.push(weapon);

        element.classList.add("active");

    }


    renderProducts();

}


/* =========================================================
   RENDER WEAPONS
========================================================= */

function renderWeapons(){

    const container =
        document.getElementById("weapons");

    container.innerHTML = "";


    const weapons =
        weaponsByCategory[currentCategory] || [];


    weapons.forEach(weapon=>{

        const button =
            document.createElement("div");

        button.className = "weapon";


        /*
            اگر قبلاً انتخاب شده باشد
            active می‌شود
        */

        if(selectedWeapons.includes(weapon)){
            button.classList.add("active");
        }


        button.textContent = weapon;


        button.onclick = function(){

            selectWeapon(
                weapon,
                button
            );

        };


        container.appendChild(button);

    });

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML = "";


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const wear =
        document
            .getElementById("wearFilter")
            .value;


    const sort =
        document
            .getElementById("sortFilter")
            .value;


    let filtered =
        products.filter(product=>{


            /*
                Search
            */

            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search) ||

                product.weapon
                    .toLowerCase()
                    .includes(search);


            /*
                Wear
            */

            const wearMatch =
                wear === "all" ||
                product.wear === wear;


            /*
                Multi Weapon Filter
            */

            let weaponMatch = true;


            /*
                اگر هیچ گانی انتخاب نشده:
                همه محصولات نمایش داده شوند
            */

            if(selectedWeapons.length > 0){

                weaponMatch =
                    selectedWeapons.includes(
                        product.weapon
                    );

            }


            return (
                searchMatch &&
                wearMatch &&
                weaponMatch
            );

        });


    /*
        Sort
    */

    if(sort === "low"){

        filtered.sort(
            (a,b)=>a.price-b.price
        );

    }

    else if(sort === "high"){

        filtered.sort(
            (a,b)=>b.price-a.price
        );

    }

    else if(sort === "name"){

        filtered.sort(
            (a,b)=>
                a.name.localeCompare(b.name)
        );

    }


    /*
        Empty
    */

    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                No skins found.
            </div>
        `;

        return;

    }


    /*
        Product Cards
    */

    filtered.forEach(product=>{

        const card =
            document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <div class="product-img">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.style.display='none'"
                >

            </div>


            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-weapon">
                    ${product.weapon}
                    •
                    ${product.wear}
                </div>


                <div class="product-bottom">

                    <div class="price">
                        ${formatPrice(product.price)}
                    </div>

                    <button
                        class="buy"
                        onclick="openProduct(${product.id})"
                    >
                        BUY
                    </button>

                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price){

    return (
        price.toLocaleString("en-US")
        + " Toman"
    );

}


/* =========================================================
   OPEN PRODUCT
========================================================= */

function openProduct(id){

    currentProduct =
        products.find(
            product => product.id === id
        );


    if(!currentProduct){
        return;
    }


    document
        .getElementById("modalImage")
        .src =
        currentProduct.image;


    document
        .getElementById("modalName")
        .textContent =
        currentProduct.name;


    document
        .getElementById("modalWeapon")
        .textContent =
        currentProduct.weapon +
        " • " +
        formatPrice(currentProduct.price);


    document
        .getElementById("modalWear")
        .value =
        currentProduct.wear;


    document
        .getElementById("productModal")
        .classList.add("show");

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document
        .getElementById("productModal")
        .classList.remove("show");

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

    if(!currentProduct){
        return;
    }


    const selectedWear =
        document
            .getElementById("modalWear")
            .value;


    cart.push({

        id:Date.now(),

        productId:
            currentProduct.id,

        name:
            currentProduct.name,

        weapon:
            currentProduct.weapon,

        price:
            currentProduct.price,

        wear:
            selectedWear

    });


    updateCart();

    closeModal();

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateCart(){

    const count =
        document
            .getElementById("cartCount");


    count.textContent =
        cart.length;


    const container =
        document
            .getElementById("cartItems");


    container.innerHTML = "";


    let total = 0;


    if(cart.length === 0){

        container.innerHTML = `
            <div style="
                color:#555;
                text-align:center;
                padding:40px 0;
            ">
                Your cart is empty.
            </div>
        `;

    }


    cart.forEach(item=>{

        total += item.price;


        const div =
            document.createElement("div");

        div.className =
            "cart-item";


        div.innerHTML = `

            <strong>
                ${item.name}
            </strong>

            <small>
                ${item.weapon}
                •
                ${item.wear}
            </small>

            <small>
                ${formatPrice(item.price)}
            </small>

            <button
                onclick="removeFromCart(${item.id})"
            >
                REMOVE
            </button>

        `;


        container.appendChild(div);

    });


    document
        .getElementById("cartTotal")
        .textContent =
        formatPrice(total);

}


/* =========================================================
   REMOVE CART ITEM
========================================================= */

function removeFromCart(id){

    cart =
        cart.filter(
            item => item.id !== id
        );

    updateCart();

}


/* =========================================================
   CART TOGGLE
========================================================= */

function toggleCart(){

    document
        .getElementById("cartPanel")
        .classList.toggle("show");

}


/* =========================================================
   TELEGRAM ORDER
========================================================= */

    if(cart.length === 0){

        alert("Your cart is empty.");

        return;

    }


    let message =
        "Hello WIZYY SHOP%0A%0A" +
        "I want to order:%0A";


    let total = 0;

        total += item.price;


        message +=
            "%0A" +
            (index + 1) +

            encodeURIComponent(item.name) +

            "%0A" +
            "Wear: " +
            encodeURIComponent(item.wear) +
            "%0A" +
            "Price: " +
            encodeURIComponent(
                formatPrice(item.price)
            ) +
            "%0A";

    });


    message +=
        "%0ATotal: " +
        encodeURIComponent(
            formatPrice(total)
        );


    /*

        عوض کن.

    const telegram =

/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document
    .getElementById("productModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){
                closeModal();
            }

        }
    );


/* =========================================================
   INITIAL STATE
========================================================= */

/*
    اول سایت:
    هیچ Category انتخاب نیست
    هیچ Weapon انتخاب نیست
    Weapon Box مخفی است
    تمام اسکین‌ها نمایش داده می‌شوند
*/

currentCategory = null;

selectedWeapons = [];

document
    .getElementById("weaponBox")
    .classList.remove("show");


renderProducts();

updateCart();

</script>
