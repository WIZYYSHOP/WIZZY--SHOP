<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WIZYY SHOP - CS2 Skin Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% -10%,rgba(180,0,0,.18),transparent 35%),
        radial-gradient(circle at 0% 100%,rgba(130,0,0,.08),transparent 30%);
    z-index:-1;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    height:86px;
    background:rgba(7,7,7,.94);
    border-bottom:1px solid #220909;
    backdrop-filter:blur(14px);
}

.header-inner{
    width:95%;
    max-width:1450px;
    height:100%;
    margin:auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-area{
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:1000;
    letter-spacing:5px;
    color:#fff;
    text-shadow:
        0 0 8px rgba(255,0,0,.45),
        0 0 25px rgba(255,0,0,.18);
}

.logo span{
    color:#e00000;
}

.subtitle{
    margin-top:5px;
    font-size:12px;
    color:#aaa;
    letter-spacing:1px;
}

/* ================= CART ================= */

.cart-button{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    background:#110909;
    border:1px solid #500d0d;
    color:#fff;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    transition:.2s;
    font-weight:bold;
}

.cart-button:hover{
    background:#e00000;
    border-color:#e00000;
}

.cart-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:20px;
    margin-left:7px;
    background:#e00000;
    border-radius:50%;
    font-size:11px;
}

/* ================= MAIN ================= */

main{
    width:95%;
    max-width:1450px;
    margin:30px auto 60px;
}

/* ================= CONTROLS ================= */

.controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.search{
    flex:1;
    min-width:240px;
}

.search input,
select{
    width:100%;
    height:46px;
    background:#101010;
    color:#fff;
    border:1px solid #2d2d2d;
    border-radius:8px;
    padding:0 15px;
    outline:none;
}

.search input:focus,
select:focus{
    border-color:#b00000;
    box-shadow:0 0 0 2px rgba(176,0,0,.12);
}

.filter-box{
    width:190px;
}

/* ================= PRICE RANGE ================= */

.price-filter{
    width:100%;
    background:#101010;
    border:1px solid #292929;
    border-radius:9px;
    padding:14px 17px 18px;
    margin-bottom:25px;
}

.price-filter-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-size:11px;
    font-weight:bold;
    color:#aaa;
}

#priceRangeText{
    color:#e00000;
    font-size:11px;
}

.range-container{
    position:relative;
    width:100%;
    height:25px;
}

.range-track,
.range-progress{
    position:absolute;
    top:10px;
    left:0;
    width:100%;
    height:5px;
    border-radius:10px;
}

.range-track{
    background:#292929;
}

.range-progress{
    background:#d00000;
}

.range-container input[type="range"]{
    position:absolute;
    width:100%;
    height:5px;
    top:10px;
    left:0;
    margin:0;
    pointer-events:none;
    appearance:none;
    background:none;
    outline:none;
}

.range-container input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#e00000;
    border:3px solid #0b0b0b;
    box-shadow:0 0 0 1px #e00000;
    cursor:pointer;
    pointer-events:auto;
}

.range-container input[type="range"]::-moz-range-thumb{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#e00000;
    border:3px solid #0b0b0b;
    box-shadow:0 0 0 1px #e00000;
    cursor:pointer;
    pointer-events:auto;
}

.range-container input[type="range"]::-webkit-slider-runnable-track{
    background:transparent;
}

.range-container input[type="range"]::-moz-range-track{
    background:transparent;
}

/* ================= CATEGORY ================= */

.section-title{
    font-size:13px;
    color:#777;
    letter-spacing:2px;
    margin-bottom:12px;
    text-transform:uppercase;
}

.categories{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.category{
    background:#101010;
    color:#bbb;
    border:1px solid #282828;
    padding:11px 17px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    letter-spacing:.5px;
    transition:.2s;
}

.category:hover{
    border-color:#9d0000;
    color:#fff;
}

.category.active{
    background:#b00000;
    border-color:#e00000;
    color:#fff;
    box-shadow:0 0 18px rgba(220,0,0,.16);
}

/* ================= WEAPON BOX ================= */

.weapon-box{
    display:none;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:10px;
    padding:18px;
    margin-bottom:28px;
}

.weapon-box.show{
    display:block;
    animation:fadeDown .2s ease;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.weapon-title{
    color:#777;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:13px;
}

.weapon-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.weapon{
    padding:9px 13px;
    border-radius:6px;
    border:1px solid #292929;
    background:#151515;
    color:#aaa;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    transition:.18s;
}

.weapon:hover{
    color:#fff;
    border-color:#850000;
}

.weapon.active{
    background:#9d0000;
    border-color:#e00000;
    color:#fff;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
    gap:18px;
}

.product{
    background:#101010;
    border:1px solid #252525;
    border-radius:12px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.product:hover{
    transform:translateY(-4px);
    border-color:#720000;
    box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.product-image{
    height:185px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#191919 0%,#0b0b0b 70%);
    overflow:hidden;
}

.product-image img{
    width:90%;
    height:90%;
    object-fit:contain;
    transition:.3s;
}

.product:hover .product-image img{
    transform:scale(1.06);
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:15px;
    font-weight:800;
    margin-bottom:7px;
}

.product-weapon{
    color:#777;
    font-size:11px;
    margin-bottom:15px;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.price{
    color:#e30000;
    font-size:15px;
    font-weight:900;
}

.buy-button{
    border:0;
    background:#c40000;
    color:#fff;
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:11px;
    transition:.2s;
}

.buy-button:hover{
    background:#f00000;
    transform:scale(1.03);
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#666;
    border:1px dashed #2a2a2a;
    border-radius:10px;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:570px;
    background:#0d0d0d;
    border:1px solid #450000;
    border-radius:14px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.65);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:20px;
}

.close{
    width:34px;
    height:34px;
    border-radius:7px;
    border:1px solid #333;
    background:#161616;
    color:#aaa;
    cursor:pointer;
}

.close:hover{
    color:#fff;
    background:#b00000;
}

.modal-image{
    height:230px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#080808;
    border-radius:10px;
    margin-bottom:20px;
}

.modal-image img{
    max-width:90%;
    max-height:90%;
    object-fit:contain;
}

.modal-details{
    display:grid;
    gap:10px;
    margin-bottom:20px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    padding:11px;
    background:#141414;
    border-radius:6px;
}

.detail-label{
    color:#777;
}

.detail-value{
    font-weight:bold;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
    padding:13px;
    border-radius:7px;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.add-cart{
    background:#a80000;
    color:#fff;
}

.add-cart:hover{
    background:#e00000;
}

.cancel{
    background:#1b1b1b;
    color:#aaa;
    border:1px solid #333!important;
}

/* ================= CART ================= */

.cart-items{
    max-height:350px;
    overflow:auto;
    margin-bottom:20px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#151515;
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
}

.cart-item img{
    width:70px;
    height:55px;
    object-fit:contain;
    background:#0b0b0b;
    border-radius:5px;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
    font-size:13px;
}

.cart-item-price{
    color:#e00000;
    font-size:12px;
    margin-top:4px;
}

.remove-item{
    background:#270909;
    border:1px solid #550d0d;
    color:#e00000;
    padding:7px 9px;
    border-radius:5px;
    cursor:pointer;
}

.remove-item:hover{
    background:#e00000;
    color:#fff;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
    padding:15px 0;
    border-top:1px solid #292929;
}

.finalize{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#e00000;
    color:#fff;
    font-weight:900;
    cursor:pointer;
}

.finalize:hover{
    background:#ff1111;
}

.empty-cart{
    text-align:center;
    color:#666;
    padding:45px 10px;
}

/* ================= FOOTER ================= */

footer{
    border-top:1px solid #1e1e1e;
    background:#070707;
    padding:35px 20px;
    text-align:center;
}

.footer-logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

.footer-logo span{
    color:#e00000;
}

.footer-text{
    margin-top:8px;
    color:#777;
    font-size:12px;
}

.telegram{
    display:inline-block;
    margin-top:16px;
    color:#d00000;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.telegram:hover{
    color:#ff2222;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        height:76px;
    }

    .logo{
        font-size:23px;
        letter-spacing:3px;
    }

    .subtitle{
        font-size:9px;
    }

    .cart-button{
        padding:9px 11px;
        font-size:10px;
    }

    main{
        width:92%;
    }

    .filter-box{
        width:100%;
    }

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .product-image{
        height:135px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:12px;
    }

    .product-weapon{
        font-size:9px;
    }

    .price{
        font-size:11px;
    }

    .buy-button{
        padding:7px 9px;
        font-size:9px;
    }

    .price-filter-top{
        font-size:10px;
    }

    #priceRangeText{
        font-size:10px;
    }
}
</style>
</head>


<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="header-inner">

        <div class="logo-area">

            <div class="logo">
                WIZYY <span>SHOP</span>
            </div>

            <div class="subtitle">
                فروشگاه تخصصی اسکین‌های CS2
            </div>

        </div>


        <button
            class="cart-button"
            onclick="openCart()"
        >
            CART

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </button>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main>

    <!-- SEARCH / WEAR -->

    <div class="controls">

        <div class="search">

            <input
                type="text"
                id="search"
                placeholder="Search skins, weapons or accessories..."
                oninput="renderProducts()"
            >

        </div>


        <div class="filter-box">

            <select
                id="wearFilter"
                onchange="renderProducts()"
            >

                <option value="all">
                    All Wear
                </option>

                <option value="Factory New">
                    Factory New
                </option>

                <option value="Minimal Wear">
                    Minimal Wear
                </option>

                <option value="Field-Tested">
                    Field-Tested
                </option>

                <option value="Well-Worn">
                    Well-Worn
                </option>

                <option value="Battle-Scarred">
                    Battle-Scarred
                </option>

            </select>

        </div>

    </div>


    <!-- PRICE RANGE -->

    <div class="price-filter">

        <div class="price-filter-top">

            <span>
                PRICE RANGE
            </span>

            <span id="priceRangeText">
                0 Toman - 5,200,000 Toman
            </span>

        </div>


        <div class="range-container">

            <div class="range-track"></div>

            <div
                class="range-progress"
                id="rangeProgress"
            ></div>


            <input
                type="range"
                id="minPrice"
                min="0"
                max="5200000"
                step="10000"
                value="0"
                oninput="updatePriceRange()"
            >


            <input
                type="range"
                id="maxPrice"
                min="0"
                max="5200000"
                step="10000"
                value="5200000"
                oninput="updatePriceRange()"
            >

        </div>

    </div>


    <!-- CATEGORIES -->

    <div class="section-title">
        Categories
    </div>


    <div class="categories">

        <button
            class="category"
            onclick="selectCategory('Pistols',this)"
        >
            PISTOLS
        </button>


        <button
            class="category"
            onclick="selectCategory('Rifles',this)"
        >
            RIFLES
        </button>


        <button
            class="category"
            onclick="selectCategory('SMGs',this)"
        >
            SMGs
        </button>


        <button
            class="category"
            onclick="selectCategory('Snipers',this)"
        >
            SNIPERS
        </button>


        <button
            class="category"
            onclick="selectCategory('Shotguns',this)"
        >
            SHOTGUNS
        </button>


        <button
            class="category"
            onclick="selectCategory('Machineguns',this)"
        >
            MACHINEGUNS
        </button>


        <button
            class="category"
            onclick="selectCategory('Knives',this)"
        >
            KNIVES
        </button>


        <button
            class="category"
            onclick="selectCategory('Accessories',this)"
        >
            ACCESSORIES
        </button>

    </div>


    <!-- WEAPON / ACCESSORY SELECTOR -->

    <div
        id="weaponBox"
        class="weapon-box"
    >

        <div
            id="weaponTitle"
            class="weapon-title"
        >
            WEAPONS
        </div>


        <div
            id="weaponList"
            class="weapon-list"
        ></div>

    </div>


    <!-- PRODUCTS -->

    <div
        id="products"
        class="products"
    ></div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <div class="footer-logo">
        WIZYY <span>SHOP</span>
    </div>


    <div class="footer-text">
        فروشگاه تخصصی اسکین‌های CS2
    </div>


    <a
        class="telegram"
        href="https://t.me/WizyyShop"
        target="_blank"
    >
        Telegram: @WizyyShop
    </a>

</footer>


<!-- ================= PRODUCT MODAL ================= -->

<div
    id="productModal"
    class="modal"
    onclick="closeModalOutside(event)"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalName">
                Product
            </h2>


            <button
                class="close"
                onclick="closeProduct()"
            >
                ×
            </button>

        </div>


        <div class="modal-image">

            <img
                id="modalImage"
                src=""
                alt=""
            >

        </div>


        <div class="modal-details">

            <div class="detail-row">

                <span class="detail-label">
                    Item
                </span>

                <span
                    class="detail-value"
                    id="modalItem"
                ></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Type
                </span>

                <span
                    class="detail-value"
                    id="modalType"
                ></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Wear
                </span>

                <span
                    class="detail-value"
                    id="modalWear"
                ></span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Price
                </span>

                <span
                    class="detail-value"
                    id="modalPrice"
                ></span>

            </div>

        </div>


        <div class="modal-actions">

            <button
                class="add-cart"
                onclick="addToCart()"
            >
                ADD TO CART
            </button>


            <button
                class="cancel"
                onclick="closeProduct()"
            >
                CANCEL
            </button>

        </div>

    </div>

</div>


<!-- ================= CART MODAL ================= -->

<div
    id="cartModal"
    class="modal"
    onclick="closeCartOutside(event)"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                YOUR CART
            </h2>


            <button
                class="close"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <div class="cart-total">

            <span>
                TOTAL
            </span>


            <span
                id="cartTotal"
                style="color:#e00000"
            >
                0 Toman
            </span>

        </div>


        <button
            class="finalize"
            onclick="finalizeOrder()"
        >
            FINALIZE ORDER
        </button>

    </div>

</div>


<script>

/* =========================
   STATE
========================= */

let selectedWeapons = [];

let currentCategory = null;

let currentProduct = null;

let cart = [];


/* =========================
   CATEGORY DATA
========================= */

const categoryData = {

    Accessories:[

/* =========================
   PRODUCTS
========================= */

const products = [

/* =========================
   PRICE FORMAT
========================= */

function formatPrice(price){

    return new Intl.NumberFormat("en-US")
        .format(price) + " Toman";

}


/* =========================
   PRICE RANGE
========================= */

function updatePriceRange(){

    const minSlider =
        document.getElementById("minPrice");

    const maxSlider =
        document.getElementById("maxPrice");


    let min =
        Number(minSlider.value);

    let max =
        Number(maxSlider.value);


    /*
        Prevent minimum
        from going above maximum.
    */

    if(min > max){

        if(
            document.activeElement ===
            minSlider
        ){

            max = min;
            maxSlider.value = max;

        }else{

            min = max;
            minSlider.value = min;

        }

    }


    const maxLimit =
        Number(maxSlider.max);


    const minPercent =
        (min / maxLimit) * 100;


    const maxPercent =
        (max / maxLimit) * 100;


    const progress =
        document.getElementById(
            "rangeProgress"
        );


    progress.style.left =
        minPercent + "%";


    progress.style.width =
        (maxPercent - minPercent) + "%";


    document.getElementById(
        "priceRangeText"
    ).textContent =
        formatPrice(min) +
        " - " +
        formatPrice(max);


    renderProducts();

}


/* =========================
   RENDER WEAPONS
========================= */

function renderWeapons(){

    const list =
        document.getElementById(
            "weaponList"
        );


    list.innerHTML = "";


    const items =
        categoryData[currentCategory] || [];


    items.forEach(item => {

        const button =
            document.createElement("button");


        button.className = "weapon";


        button.textContent = item;


        if(
            selectedWeapons.includes(item)
        ){

            button.classList.add("active");

        }


        button.onclick =
            function(){

                selectWeapon(
                    item,
                    button
                );

            };


        list.appendChild(button);

    });

}


/* =========================
   CATEGORY SELECT
========================= */

function selectCategory(
    category,
    element
){

    /*
        Clicking the selected
        category again resets it.
    */

    if(
        currentCategory === category
    ){

        currentCategory = null;

        selectedWeapons = [];


        document
            .querySelectorAll(".category")
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


        document
            .getElementById("weaponBox")
            .classList.remove("show");


        renderProducts();

        return;

    }


    currentCategory = category;

    selectedWeapons = [];


    document
        .querySelectorAll(".category")
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    element.classList.add("active");


    document
        .getElementById("weaponBox")
        .classList.add("show");


    document.getElementById(
        "weaponTitle"
    ).textContent =
        category === "Accessories"
        ? "ACCESSORIES"
        : category.toUpperCase()
          + " WEAPONS";


    renderWeapons();

    renderProducts();

}


/* =========================
   WEAPON / ACCESSORY SELECT
========================= */

function selectWeapon(
    weapon,
    element
){

    const index =
        selectedWeapons.indexOf(
            weapon
        );


    if(index !== -1){

        selectedWeapons.splice(
            index,
            1
        );


        element.classList.remove(
            "active"
        );

    }else{

        selectedWeapons.push(
            weapon
        );


        element.classList.add(
            "active"
        );

    }


    renderProducts();

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

    const container =
        document.getElementById(
            "products"
        );


    container.innerHTML = "";


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const wear =
        document.getElementById(
            "wearFilter"
        ).value;


    const minPrice =
        Number(
            document.getElementById(
                "minPrice"
            ).value
        );


    const maxPrice =
        Number(
            document.getElementById(
                "maxPrice"
            ).value
        );


    let filtered =
        products.filter(product => {


            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search)
                ||
                product.weapon
                    .toLowerCase()
                    .includes(search);


            const wearMatch =
                wear === "all"
                ||
                product.wear === wear;


            const priceMatch =
                product.price >= minPrice
                &&
                product.price <= maxPrice;


            let categoryMatch = true;


            if(
                currentCategory !== null
            ){

                categoryMatch =
                    product.category ===
                    currentCategory;

            }


            let weaponMatch = true;


            if(
                currentCategory !== null
                &&
                selectedWeapons.length > 0
            ){

                weaponMatch =
                    selectedWeapons.includes(
                        product.weapon
                    );

            }


            return (
                searchMatch &&
                wearMatch &&
                priceMatch &&
                categoryMatch &&
                weaponMatch
            );

        });


    /* EMPTY */

    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">
                No skins found.
            </div>

        `;

        return;

    }


    /* PRODUCTS */

    filtered.forEach(product => {

        const card =
            document.createElement(
                "div"
            );


        card.className = "product";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >

            </div>


            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>


                <div class="product-weapon">
                    ${product.weapon}
                    •
                    ${product.wear}
                </div>


                <div class="product-bottom">

                    <div class="price">
                        ${formatPrice(
                            product.price
                        )}
                    </div>


                    <button
                        class="buy-button"
                        onclick="openProduct(${product.id})"
                    >
                        BUY
                    </button>

                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   PRODUCT MODAL
========================= */

function openProduct(id){

    currentProduct =
        products.find(
            product =>
                product.id === id
        );


    if(!currentProduct){
        return;
    }


    document.getElementById(
        "modalName"
    ).textContent =
        currentProduct.name;


    document.getElementById(
        "modalImage"
    ).src =
        currentProduct.image;


    document.getElementById(
        "modalImage"
    ).alt =
        currentProduct.name;


    document.getElementById(
        "modalItem"
    ).textContent =
        currentProduct.name;


    document.getElementById(
        "modalType"
    ).textContent =
        currentProduct.weapon;


    document.getElementById(
        "modalWear"
    ).textContent =
        currentProduct.wear;


    document.getElementById(
        "modalPrice"
    ).textContent =
        formatPrice(
            currentProduct.price
        );


    document
        .getElementById("productModal")
        .classList.add("show");

}


function closeProduct(){

    document
        .getElementById("productModal")
        .classList.remove("show");

}


function closeModalOutside(event){

    if(
        event.target.id ===
        "productModal"
    ){

        closeProduct();

    }

}


/* =========================
   CART
========================= */

function addToCart(){

    if(!currentProduct){
        return;
    }


    cart.push(
        currentProduct
    );


    updateCart();

    closeProduct();

}


function updateCart(){

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.length;


    renderCart();

}


function renderCart(){

    const container =
        document.getElementById(
            "cartItems"
        );


    container.innerHTML = "";


    if(cart.length === 0){

        container.innerHTML = `

            <div class="empty-cart">
                Your cart is empty.
            </div>

        `;


        document.getElementById(
            "cartTotal"
        ).textContent =
            "0 Toman";


        return;

    }


    let total = 0;


    cart.forEach(
        (product,index) => {

            total += product.price;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "cart-item";


            item.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div class="cart-item-info">

                    <div class="cart-item-name">
                        ${product.name}
                    </div>


                    <div class="cart-item-price">
                        ${formatPrice(
                            product.price
                        )}
                    </div>

                </div>


                <button
                    class="remove-item"
                    onclick="removeFromCart(${index})"
                >
                    REMOVE
                </button>

            `;


            container.appendChild(item);

        }
    );


    document.getElementById(
        "cartTotal"
    ).textContent =
        formatPrice(total);

}


function removeFromCart(index){

    cart.splice(
        index,
        1
    );


    updateCart();

}


function openCart(){

    renderCart();


    document
        .getElementById("cartModal")
        .classList.add("show");

}


function closeCart(){

    document
        .getElementById("cartModal")
        .classList.remove("show");

}


function closeCartOutside(event){

    if(
        event.target.id ===
        "cartModal"
    ){

        closeCart();

    }

}


/* =========================
   TELEGRAM
========================= */

function finalizeOrder(){

    if(cart.length === 0){

        alert(
            "Your cart is empty."
        );

        return;

    }


    let message =
        "WIZYY SHOP ORDER\n\n";


    let total = 0;


    cart.forEach(
        (product,index) => {

            total += product.price;


            message +=
                `${index + 1}. ${product.name} - ${formatPrice(product.price)}\n`;

        }
    );


    message +=
        `\nTOTAL: ${formatPrice(total)}`;


    const telegram =
        "https://t.me/WizyyShop?text=" +
        encodeURIComponent(message);


    window.open(
        telegram,
        "_blank"
    );

}

========================= */

currentCategory = null;

selectedWeapons = [];


document

    .classList.remove("show");


renderProducts();

updateCart();

updatePriceRange();
