<!DOCTYPE html>

<head>

<title>WIZYY SHOP</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
    height:90px;
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(5,5,5,.94);
    border-bottom:1px solid #1b1b1b;

    backdrop-filter:blur(14px);
}


/* WIZYY SHOP کاملاً آزاد */

.logo{
    text-align:center;
    background:none;
    border:none;
    box-shadow:none;
    padding:0;
}

.logo h1{
    font-size:32px;
    font-weight:900;
    letter-spacing:6px;
    color:#fff;

    text-shadow:
        0 0 10px rgba(255,255,255,.08);
}

.logo h1 span{
    color:#e10600;

    text-shadow:
        0 0 15px rgba(225,6,0,.4);
}

.logo p{
    margin-top:6px;
    color:#777;
    font-size:11px;
    letter-spacing:1px;
}


/* =========================
   CART BUTTON
========================= */

.cart-button{
    position:absolute;
    right:25px;
    top:25px;

    background:#0d0d0d;
    border:1px solid #292929;

    padding:10px 16px;
    border-radius:7px;

    color:#aaa;
    cursor:pointer;

    transition:.2s;
}

.cart-button:hover{
    color:#fff;
    border-color:#e10600;
}

.cart-button span{
    color:#e10600;
    font-weight:bold;
}


/* =========================
   HERO
========================= */

.hero{
    text-align:center;

    padding:70px 20px 45px;

    background:
        radial-gradient(
            circle at center,
            rgba(225,6,0,.13),
            transparent 45%
        );
}

.hero h2{
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
}

.hero h2 span{
    color:#e10600;
}

.hero p{
    margin-top:12px;
    color:#777;
    font-size:14px;
}


/* =========================
   CATEGORIES
========================= */

.categories{
    max-width:1200px;
    margin:auto;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:10px;

    padding:20px;
}

.category{
    min-width:120px;

    padding:13px 20px;

    background:#0b0b0b;
    border:1px solid #272727;

    border-radius:7px;

    color:#888;

    font-size:12px;
    font-weight:bold;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.category:hover{
    color:#fff;
    border-color:#8f0000;
}

.category.active{
    color:#fff;

    background:#180606;

    border-color:#e10600;

    box-shadow:
        0 0 18px rgba(225,6,0,.18);
}


/* =========================
   WEAPON BOX
========================= */

.weapon-box{
    display:none;

    max-width:1200px;

    margin:15px auto 35px;

    padding:25px;

    background:#080808;

    border:1px solid #202020;

    border-radius:12px;
}

.weapon-box.show{
    display:block;
}

.weapon-title{
    text-align:center;

    color:#666;

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:18px;
}

.weapons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
}

.weapon{
    padding:10px 15px;

    background:#101010;

    border:1px solid #282828;

    border-radius:7px;

    color:#888;

    font-size:12px;

    cursor:pointer;

    transition:.2s;
}

.weapon:hover{
    color:#fff;
    border-color:#900000;
}

.weapon.active{
    color:#fff;

    background:#280606;

    border-color:#e10600;

    box-shadow:
        0 0 14px rgba(225,6,0,.25);
}


/* =========================
   FILTERS
========================= */

.filters{
    max-width:1200px;

    margin:0 auto 25px;

    padding:0 20px;

    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;

    padding:13px 15px;

    background:#0c0c0c;

    border:1px solid #282828;

    border-radius:7px;

    color:#fff;

    outline:none;
}

.search:focus{
    border-color:#e10600;
}

.filters select{
    padding:13px 15px;

    background:#0c0c0c;

    border:1px solid #282828;

    border-radius:7px;

    color:#999;

    outline:none;

    cursor:pointer;
}

.filters select:focus{
    border-color:#e10600;
}


/* =========================
   PRODUCTS
========================= */

.products{
    max-width:1200px;

    margin:auto;

    padding:0 20px 70px;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(215px,1fr));

    gap:18px;
}

.product{
    background:#0b0b0b;

    border:1px solid #202020;

    border-radius:11px;

    overflow:hidden;

    transition:.25s;
}

.product:hover{
    transform:translateY(-5px);

    border-color:#750000;

    box-shadow:
        0 10px 35px rgba(0,0,0,.5);
}

.product-image{
    height:165px;

    background:
        radial-gradient(
            circle,
            #151515,
            #080808
        );

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.product-image img{
    width:92%;
    height:92%;

    object-fit:contain;

    transition:.3s;
}

.product:hover .product-image img{
    transform:scale(1.06);
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
}

.product-weapon{
    color:#666;

    font-size:11px;

    margin-top:6px;
}

.product-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:16px;
}

.price{
    color:#e10600;

    font-weight:bold;

    font-size:14px;
}

.buy-button{
    border:none;

    background:#e10600;

    color:white;

    padding:8px 13px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.buy-button:hover{
    background:#ff1710;
}


/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#555;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.82);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:2000;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:500px;

    background:#0a0a0a;

    border:1px solid #351010;

    border-radius:13px;

    padding:25px;

    position:relative;
}

.close-modal{
    position:absolute;

    right:17px;
    top:12px;

    font-size:25px;

    color:#666;

    cursor:pointer;
}

.close-modal:hover{
    color:#fff;
}

.modal-image{
    height:220px;

    background:#080808;

    border-radius:9px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:20px;
}

.modal-image img{
    width:90%;
    height:90%;

    object-fit:contain;
}

.modal-content h2{
    font-size:22px;
}

.modal-subtitle{
    margin-top:6px;

    color:#666;

    font-size:12px;
}

.modal-options{
    margin-top:20px;
}

.modal-options label{
    display:block;

    color:#777;

    font-size:11px;

    margin-bottom:7px;
}

.modal-options select{
    width:100%;

    padding:13px;

    background:#111;

    color:#aaa;

    border:1px solid #292929;

    border-radius:7px;

    outline:none;
}

.add-cart{
    width:100%;

    margin-top:20px;

    padding:14px;

    border:none;

    background:#e10600;

    color:#fff;

    border-radius:7px;

    font-weight:bold;

    cursor:pointer;
}

.add-cart:hover{
    background:#ff1710;
}


/* =========================
   CART PANEL
========================= */

.cart-panel{
    position:fixed;

    top:0;
    right:-430px;

    width:410px;
    max-width:95%;

    height:100vh;

    background:#090909;

    border-left:1px solid #301010;

    z-index:3000;

    padding:25px;

    transition:.3s;

    overflow-y:auto;
}

.cart-panel.show{
    right:0;
}

.cart-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-bottom:20px;

    border-bottom:1px solid #222;
}

.cart-header h2{
    font-size:20px;
}

.cart-close{
    font-size:23px;

    color:#666;

    cursor:pointer;
}

.cart-close:hover{
    color:#fff;
}

.cart-item{
    padding:16px 0;

    border-bottom:1px solid #202020;
}

.cart-item strong{
    font-size:14px;
}

.cart-item small{
    display:block;

    color:#666;

    margin-top:5px;
}

.remove-item{
    border:none;

    background:none;

    color:#e10600;

    margin-top:8px;

    cursor:pointer;

    font-size:11px;
}

.cart-total{
    margin-top:25px;

    display:flex;

    justify-content:space-between;

    font-weight:bold;
}

.telegram-button{
    width:100%;

    margin-top:20px;

    padding:14px;

    border:none;

    background:#e10600;

    color:#fff;

    border-radius:7px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid #191919;

    text-align:center;

    padding:35px 20px;

    color:#555;

    font-size:12px;

footer strong{
    color:#e10600;
}

footer p{
    margin-top:8px;

/* =========================

@media(max-width:650px){

    .price{

function selectCategory(category,element){

    /*

        اگر دوباره همان Category کلیک شد
        همه انتخاب‌ها پاک شوند
    */

    if(currentCategory === category){

        currentCategory = null;

        selectedWeapons = [];


        document
            .querySelectorAll(".category")
            .forEach(item=>{
                item.classList.remove("active");
            });


        document
            .getElementById("weaponBox")
            .classList.remove("show");


        renderProducts();

        return;
    }


    /*
        Category جدید
    */

    currentCategory = category;

    selectedWeapons = [];


    document
        .querySelectorAll(".category")
        .forEach(item=>{
            item.classList.remove("active");
        });


    element.classList.add("active");


    document
        .getElementById("weaponBox")
        .classList.add("show");


    document
        .getElementById("weaponTitle")
        .textContent =
        category.toUpperCase() + " WEAPONS";


    renderWeapons();

    renderProducts();

}



/* =========================================================
   MULTI SELECT WEAPONS
========================================================= */

function selectWeapon(weapon,element){

    /*
        بررسی می‌کنیم گان قبلاً انتخاب شده یا نه
    */

    const index =
        selectedWeapons.indexOf(weapon);


    /*
        اگر انتخاب شده بود:
        فقط خودش حذف شود
    */

    if(index !== -1){

        selectedWeapons.splice(index,1);

        element.classList.remove("active");

    }


    /*
        اگر انتخاب نشده بود:
        به لیست اضافه شود
    */

    else{

        selectedWeapons.push(weapon);

        element.classList.add("active");

    }


    /*
        محصولات دوباره فیلتر شوند
    */

    renderProducts();

}



/* =========================================================
   RENDER WEAPONS
========================================================= */

function renderWeapons(){

    const container =
        document.getElementById("weapons");


    container.innerHTML = "";


    const weapons =
        weaponsByCategory[currentCategory] || [];


    weapons.forEach(weapon=>{

        const button =
            document.createElement("div");


        button.className = "weapon";


        /*
            اگر گان قبلاً انتخاب شده
            دوباره active شود
        */

        if(
            selectedWeapons.includes(weapon)
        ){

            button.classList.add("active");

        }


        button.textContent = weapon;


        button.onclick = function(){

            selectWeapon(
                weapon,
                button
            );

        };


        container.appendChild(button);

    });

}



/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");


    container.innerHTML = "";


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const wear =
        document
            .getElementById("wearFilter")
            .value;


    const sort =
        document
            .getElementById("sortFilter")
            .value;


    let filtered =
        products.filter(product=>{


            /*
                SEARCH
            */

            const searchMatch =

                product.name
                    .toLowerCase()
                    .includes(search)

                ||

                product.weapon
                    .toLowerCase()
                    .includes(search);


            /*
                WEAR
            */

            const wearMatch =

                wear === "all"

                ||

                product.wear === wear;


            /*
                MULTI WEAPON
            */

            let weaponMatch = true;


            /*
                اگر حداقل یک گان انتخاب شده:
                فقط همان گان‌ها
            */

            if(selectedWeapons.length > 0){

                weaponMatch =
                    selectedWeapons.includes(
                        product.weapon
                    );

            }


            return (
                searchMatch &&
                wearMatch &&
                weaponMatch
            );

        });



    /* =========================
       SORT
    ========================= */

    if(sort === "low"){

        filtered.sort(
            (a,b)=>a.price-b.price
        );

    }

    else if(sort === "high"){

        filtered.sort(
            (a,b)=>b.price-a.price
        );

    }

    else if(sort === "name"){

        filtered.sort(
            (a,b)=>
                a.name.localeCompare(b.name)
        );

    }



    /* =========================
       EMPTY
    ========================= */

    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                No skins found.

            </div>

        `;

        return;

    }



    /* =========================
       PRODUCTS
    ========================= */

    filtered.forEach(product=>{

        const card =
            document.createElement("div");


        card.className = "product";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <div class="product-info">

                <div class="product-name">

                    ${product.name}

                </div>


                <div class="product-weapon">

                    ${product.weapon}

                    •

                    ${product.wear}

                </div>


                <div class="product-bottom">

                    <div class="price">

                        ${formatPrice(product.price)}

                    </div>


                    <button
                        class="buy-button"
                        onclick="openProduct(${product.id})"
                    >

                        BUY

                    </button>

                </div>

            </div>

        `;


        container.appendChild(card);

    });

}



/* =========================================================
   PRICE
========================================================= */

function formatPrice(price){

    return (
        price.toLocaleString("en-US")
        +
        " Toman"
    );

}



/* =========================================================
   OPEN PRODUCT
========================================================= */

function openProduct(id){

    currentProduct =
        products.find(
            product=>product.id===id
        );


    if(!currentProduct){
        return;
    }


    document
        .getElementById("modalImage")
        .src =
        currentProduct.image;


    document
        .getElementById("modalName")
        .textContent =
        currentProduct.name;


    document
        .getElementById("modalWeapon")
        .textContent =
        currentProduct.weapon
        +
        " • "
        +
        formatPrice(
            currentProduct.price
        );


    document
        .getElementById("modalWear")
        .value =
        currentProduct.wear;


    document
        .getElementById("productModal")
        .classList.add("show");

}



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document
        .getElementById("productModal")
        .classList.remove("show");

}



/* =========================================================
   ADD CART
========================================================= */

function addToCart(){

    if(!currentProduct){
        return;
    }


    const wear =
        document
            .getElementById("modalWear")
            .value;


    cart.push({

        id:Date.now(),

        name:
            currentProduct.name,

        weapon:
            currentProduct.weapon,

        price:
            currentProduct.price,

        wear:wear

    });


    updateCart();

    closeModal();

}



/* =========================================================
   CART
========================================================= */

function updateCart(){

    document
        .getElementById("cartCount")
        .textContent =
        cart.length;


    const container =
        document
            .getElementById("cartItems");


    container.innerHTML = "";


    let total = 0;


    if(cart.length === 0){

        container.innerHTML = `

            <div style="
                color:#555;
                text-align:center;
                padding:45px 0;
            ">

                Your cart is empty.

            </div>

        `;

    }


    cart.forEach(item=>{

        total += item.price;


        const div =
            document.createElement("div");


        div.className = "cart-item";


        div.innerHTML = `

            <strong>

                ${item.name}

            </strong>


            <small>

                ${item.weapon}

                •

                ${item.wear}

            </small>


            <small>

                ${formatPrice(item.price)}

            </small>


            <button
                class="remove-item"
                onclick="removeCartItem(${item.id})"
            >

                REMOVE

            </button>

        `;


        container.appendChild(div);

    });


    document
        .getElementById("cartTotal")
        .textContent =
        formatPrice(total);

}



/* =========================================================
   REMOVE CART
========================================================= */

function removeCartItem(id){

    cart =
        cart.filter(
            item=>item.id!==id
        );


    updateCart();

}



/* =========================================================
   CART PANEL
========================================================= */

function toggleCart(){

    document
        .getElementById("cartPanel")
        .classList.toggle("show");

}



/* =========================================================
   TELEGRAM
========================================================= */

function sendTelegram(){

    if(cart.length === 0){

        alert(
            "Your cart is empty."
        );

        return;

    }


    let message =
        "Hello WIZYY SHOP%0A%0A";

    message +=
        "I want to order:%0A";


    let total = 0;


    cart.forEach((item,index)=>{

        total += item.price;


        message +=

            "%0A"

            +

            (index+1)

            +

            ". "

            +

            encodeURIComponent(
                item.name
            )

            +

            "%0AWeapon: "

            +

            encodeURIComponent(
                item.weapon
            )

            +

            "%0AWear: "

            +

            encodeURIComponent(
                item.wear
            )

            +

            "%0APrice: "

            +

            encodeURIComponent(
                formatPrice(
                    item.price
                )
            )

            +

            "%0A";

    });


    message +=

        "%0ATotal: "

        +

        encodeURIComponent(
            formatPrice(total)
        );


    const telegramURL =

        "https://t.me/WizyyShop?text="

        +

        message;


    window.open(
        telegramURL,
        "_blank"
    );

}



/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

document
    .getElementById("productModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeModal();

            }

        }
    );



/* =========================================================
   INITIAL
========================================================= */

currentCategory = null;

selectedWeapons = [];

document
    .getElementById("weaponBox")
    .classList.remove("show");

renderProducts();

updateCart();

</script>
